services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADAMRMS_DEVCONTAINER: 'true'
      DB_HOSTNAME: db
      DB_DATABASE: db
      DB_USERNAME: user
      DB_PASSWORD: pass
      DB_PORT: '3306'
      DEV_MODE: 'true'
      CONFIG_ROOTURL: http://localhost:8080
      CONFIG_AWS_S3_KEY: key-id-of-top-secret-key
      CONFIG_AWS_S3_SECRET: topsecretkeydonottellanyone
      CONFIG_AWS_S3_BUCKET: localtestingbucket
      CONFIG_AWS_S3_SERVER_ENDPOINT: http://s3filestore:9090
      CONFIG_AWS_S3_BROWSER_ENDPOINT: http://localhost:9090
      CONFIG_AWS_S3_ENDPOINT_PATHSTYLE: Enabled
      CONFIG_AWS_S3_REGION: us-east-1
      CONFIG_EMAILS_ENABLED: Disabled
      CONFIG_EMAILS_PROVIDER: SMTP
      CONFIG_EMAILS_FROM_EMAIL: adamrms@devcontainer.local
      CONFIG_EMAILS_SMTP_SERVER: mailpit
      CONFIG_EMAILS_SMTP_PORT: '1025'
  db:
    image: mysql:8.0
    command: --sort_buffer_size=512K
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 2s
      timeout: 5s
      retries: 60
  s3filestore:
    image: adobe/s3mock:3.5.2
    volumes:
      - s3_data:/s3files
    environment:
      initialBuckets: localtestingbucket
      retainFilesOnExit: 'true'
      root: /s3files
  mailpit:
    image: axllent/mailpit:v1.20
    volumes:
      - email_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '5000'
  phpmyadmin:
    image: phpmyadmin:5-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: '3306'
      PMA_USER: user
      PMA_PASSWORD: pass
volumes:
  db_data:
  s3_data:
  email_data:
